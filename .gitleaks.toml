# Default rules, plus paths that are local environments and caches and never committed.
[extend]
useDefault = true

[[allowlists]]
description = "local environments and caches (gitignored)"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)\.git/''',
  '''(^|/)__pycache__/''',
  '''(^|/)\.(ruff|pytest)_cache/''',
  '''(^|/)privacy/forbidden-strings\.txt$''',
]

[[allowlists]]
description = "sha256 pins of the embedding model's files (tokenizer.json and others), not secrets"
condition = "AND"
paths = ['''^src/raglab/adapters/fastembed_embed\.py$''']
regexes = ['''^[0-9a-f]{64}$''']
