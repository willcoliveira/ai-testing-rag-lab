# The tenant guard (S3; R-21, R-13, R-16): must-block and must-not-block cases.
# Deliberate test material for the guard suites (datasets/security/README.md); never ingested.
layer: tenant
cases:
- id: TEN-B01
  kind: must_block
  input:
    stage: input
    question: "How long can my VPN sit idle?"
    tenant: null
    caller: null
  expected: block
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-21)
  why: "A request that names no tenant gets no answer from any tenant."
- id: TEN-B02
  kind: must_block
  input:
    stage: input
    question: "How long can my VPN sit idle?"
    tenant: shared
    caller: null
  expected: block
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-21)
  why: "shared is a kind of document, not anyone's tenant."
- id: TEN-B03
  kind: must_block
  input:
    stage: input
    question: "How long can my VPN sit idle?"
    tenant: Tenant-A
    caller: null
  expected: block
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-21)
  why: "A tenant in another letter case is an unknown tenant: the guard fails closed."
- id: TEN-B04
  kind: must_block
  input:
    stage: input
    question: "What is the minimum password length?"
    tenant: tenant-b
    caller: [tenant-a]
  expected: block
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-21)
  why: "Tenant id spoofing: a token for tenant A only asks as tenant B."
- id: TEN-B05
  kind: must_block
  input:
    stage: retrieved
    tenant: tenant-a
    chunks:
    - {doc: A-PWD-V2, tenant: tenant-a, status: approved}
    - {doc: B-PWD, tenant: tenant-b, status: approved}
  expected: block
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-16)
  why: "A chunk of the other tenant after retrieval withholds the answer before the model."
- id: TEN-N01
  kind: must_not_block
  input:
    stage: input
    question: "How long can my VPN sit idle?"
    tenant: tenant-a
    caller: null
  expected: pass
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-21)
  why: "A local run (CLI, eval) has no caller and names a known tenant."
- id: TEN-N02
  kind: must_not_block
  input:
    stage: input
    question: "How long can my VPN sit idle?"
    tenant: tenant-b
    caller: [tenant-a, tenant-b]
  expected: pass
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-21)
  why: "The demo token may use both tenants."
- id: TEN-N03
  kind: must_not_block
  input:
    stage: input
    question: "What is the minimum password length?"
    tenant: tenant-a
    caller: [tenant-a]
  expected: pass
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-21)
  why: "A token for tenant A asks as tenant A."
- id: TEN-N04
  kind: must_not_block
  input:
    stage: retrieved
    tenant: tenant-a
    chunks:
    - {doc: A-PWD-V2, tenant: tenant-a, status: approved}
    - {doc: X-NIST, tenant: shared, status: reference}
  expected: pass
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-13)
  why: "Tenant A sees its own documents and the shared references."
- id: TEN-N05
  kind: must_not_block
  input:
    stage: retrieved
    tenant: tenant-b
    chunks:
    - {doc: B-MFA, tenant: tenant-b, status: approved}
    - {doc: X-NCSC, tenant: shared, status: reference}
  expected: pass
  ratified_by: "maintainer, 2026-10-24"
  origin: handwritten 2026-10-24 (R-13)
  why: "Tenant B sees its own documents and the shared references."
