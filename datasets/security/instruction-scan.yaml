# The instruction scan at ingest (S7; R-17, arrow L9): must-block (quarantined) and
# must-not-block (indexed) chunk texts. A text is flagged when it matches two of the rule groups
# addressed, change and send (src/raglab/ingest/scan.py). The must-not-block cases are near
# misses: policy prose with one group. Deliberate test material (datasets/security/README.md).
layer: instruction-scan
