# S9 (docs/OBSERVABILITY.md): the OpenTelemetry Collector `make perf-smoke` runs, core `otelcol`
# v0.162.0. The local pipeline: OTLP over HTTP from `raglab serve`, received on the loopback
# interface only, batched, and written to a file under runs/tmp/ (gitignored). Nothing leaves the
# machine. The port and the file come from the environment scripts/perf_smoke.py sets.
# Lab practice: one collector per run and a file as the sink; production runs collectors as agents
# or a gateway, with sampling, and routes to Langfuse or Datadog (S10).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:RAGLAB_OTELCOL_PORT}

processors:
  batch: {}

exporters:
  file/local:
    path: ${env:RAGLAB_OTELCOL_TRACES}

service:
  # no metrics endpoint of the collector's own (it would listen on port 8888)
  telemetry:
    metrics:
      level: none
    logs:
      level: warn
  pipelines:
    traces/local:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/local]
