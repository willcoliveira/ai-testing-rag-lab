# The machine-readable register of the policy corpus (decision D-05): one entry per document of
# the pack, read by S1b (ingestion) and S3 (generation). Fields: id; status (approved, superseded
# or reference, as docs/TEST-PLAN.md section 3 defines them); supersedes (the id this document
# replaces, or null); tenant (tenant-a, tenant-b or shared); path (the file ingestion reads: the
# PDF, HTML export or scanned PNG where the document is rendered, else its Markdown).
# It agrees with the inventory of corpus/SOURCES.md (tests/unit/test_corpus_sources.py checks
# it). A document's own front matter or text is never the register.
# The attack files (status test material in SOURCES.md) are deliberately not listed: in an attack
# run they are ingested as pages outside the register, as a real poisoned page would be, so no
# pipeline can drop them by reading this file (corpus/SPEC.md section 3).
