# The release's test slice (v0.1, docs/plans/2026-10-20-v0.1-release.md): the generation suite on
# the test split of the golden set (every test retrieval question and behaviour case, three trials)
# on the local model, once per release. Run it with `make release-local`, which passes --gate
# release inside one `raglab ollama session` (docs/LOCAL-MODEL.md, runbooks/release.md). `raglab
# eval` refuses split test under any gate but nightly and release, and publish refuses such a run
# under any other gate: the test split is held out, and no test result is read to tune anything
# (datasets/DATASHEET.md, Split). A generation run uses its config's split (the split is part of
# the config's sha256), so the release has its own config, as the nightly does.
#
# Lab practice: production runs the release's test slice in CI against a managed model endpoint,
# with thresholds agreed before the release; here it runs once on the Mac and is reported.
#
# Everything else is config/local-ollama.toml's (the model pinned by tag and digest, the card's
# sampling settings, thinking off, no response format, the session limits); keep the three equal.
# Read by raglab.evals.config.load_generation (strict: an unknown or missing key stops the run).
name = "generation-local-ollama-release"
suite = "generation"

[dataset]
path = "datasets/golden.v1.jsonl"
split = "test"

[chunker]
chunk_size = 1200
overlap = 1

[embedder]
provider = "fastembed"
model = "BAAI/bge-small-en-v1.5"
revision = "aa8f8b060edb00e03bfdd08813a2949946c8ba55"

[retriever]
kind = "dense"
k = 5

[generator]
provider = "openai-compat"
model = "nemotron-3.5-lightning:30b-a3b-mlx"
digest = "d1e17d7dabacb401dec6440b4ec987ea053b9568b01f89fb3d54f8b2e71397be"
base_url = "http://127.0.0.1:11434"
temperature = 1.0
top_p = 0.95
max_tokens = 1024
timeout_s = 120
reasoning_effort = "none"
response_format = "none"

[generation]
trials = 3
seed = 20261018
level = 0.95
run_timeout_s = 3600

[api]
tokens = { demo = ["tenant-a", "tenant-b"], tenant-a-only = ["tenant-a"] }

[ollama]
host = "127.0.0.1:11434"
keep_alive = "2m"
max_loaded_models = 1
num_parallel = 1
context_length = 8192
memory_margin_gb = 4
