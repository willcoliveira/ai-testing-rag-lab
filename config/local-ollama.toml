# The generation suite on a local model through Ollama's OpenAI-compatible endpoint (the S3 live
# run). Run it with `make eval-local`, which starts the server for the session and always stops it
# (docs/LOCAL-MODEL.md).
#
# The model is pinned by tag AND digest: Ollama tags are not dated, so after
# `ollama pull nemotron-3.5-lightning:30b-a3b-mlx`, copy the model's "digest" from the server's
# /api/tags (curl -s http://127.0.0.1:11434/api/tags) into generator.digest below. Until then the
# config refuses to run, and the adapter refuses a server whose copy of the tag has another digest.
# Pinned 2026-10-18 from /api/tags after the pull on Ollama 0.40.6 (19072744624 bytes on disk,
# format safetensors, runner mlx); 0.40.4 refused this model ("requires a newer version").
# Read by raglab.evals.config.load_generation (strict: an unknown or missing key stops the run).
name = "generation-local-ollama"
suite = "generation"

[dataset]
path = "datasets/golden.v1.jsonl"
split = "dev"

[chunker]
chunk_size = 1200
overlap = 1

[embedder]
provider = "fastembed"
model = "BAAI/bge-small-en-v1.5"
revision = "aa8f8b060edb00e03bfdd08813a2949946c8ba55"

[retriever]
kind = "dense"
k = 5

[generator]
provider = "openai-compat"
model = "nemotron-3.5-lightning:30b-a3b-mlx"
digest = "d1e17d7dabacb401dec6440b4ec987ea053b9568b01f89fb3d54f8b2e71397be"
base_url = "http://127.0.0.1:11434"
temperature = 0.2
max_tokens = 1024
timeout_s = 120
# Thinking off, sent as the OpenAI-compatible field; recorded in the manifest. Whether the
# installed Ollama honours it is checked by the live contract test before the run.
reasoning_effort = "none"

[generation]
trials = 3
seed = 20261018
level = 0.95
probes = "datasets/probes.s3.jsonl"
run_timeout_s = 3600

[api]
tokens = { demo = ["tenant-a", "tenant-b"], tenant-a-only = ["tenant-a"] }

# The server's session limits (raglab.runtime.ollama): loopback only, one model, one request at a
# time, a context window far below the model's default, the model unloaded soon after its last
# request, and a free-memory margin on top of the model's size before a session may start. The
# margin is what the rest of the Mac keeps while the model is loaded (on a 48 GiB Mac with Docker
# Desktop running, about 23 GiB is available and the model takes about 17.8 GiB).
[ollama]
host = "127.0.0.1:11434"
keep_alive = "2m"
max_loaded_models = 1
num_parallel = 1
context_length = 8192
memory_margin_gb = 4
