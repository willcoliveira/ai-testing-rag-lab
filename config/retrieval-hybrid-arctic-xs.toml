# S8 (GA10, the embedder swap): hybrid retrieval, dense with the second pinned embedder
# (snowflake/snowflake-arctic-embed-xs) and BM25, fused by reciprocal rank; a measured result, never a baseline.
# Read by raglab.evals.config (strict: an unknown or missing key stops the run).
name = "retrieval-hybrid-arctic-xs"
suite = "retrieval"

[dataset]
path = "datasets/golden.v2.jsonl"
split = "dev"

[chunker]
chunk_size = 1200
overlap = 1

[embedder]
provider = "fastembed"
model = "snowflake/snowflake-arctic-embed-xs"
revision = "d8c86521100d3556476a063fc2342036d45c106f"

[retriever]
kind = "hybrid"
k = 5
candidates = 50
rrf_k = 60

[bootstrap]
seed = 20261006
resamples = 2000
level = 0.95
