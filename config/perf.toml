# S9: what `make perf-smoke` serves (docs/OBSERVABILITY.md): the perf stub, FakeChat's echo under
# the provider name perf-stub (provenance fake, never published), behind the local config's
# retrieval settings (chunker, the cached embedder, k) and the demo tokens. Only `raglab serve`
# reads it, and only with PERF_TEST_MODE=1 where RAGLAB_ENV is ci or local
# (raglab.api.environment); every other command refuses it, and PERF_TEST_MODE=1 refuses any other
# config. It loads no model and needs no Ollama.
# Read by raglab.evals.config.load_generation (strict: an unknown or missing key stops the run).
name = "generation-perf"
suite = "generation"

[dataset]
path = "datasets/golden.v2.jsonl"
split = "dev"

[chunker]
chunk_size = 1200
overlap = 1

[embedder]
provider = "fastembed"
model = "BAAI/bge-small-en-v1.5"
revision = "aa8f8b060edb00e03bfdd08813a2949946c8ba55"

[retriever]
kind = "dense"
k = 5

[generator]
provider = "perf-stub"
model = "perf-stub"

[generation]
trials = 3
seed = 20261018
level = 0.95
run_timeout_s = 600

# Lab: public demo values, as in config/fake.toml and config/local-ollama.toml
[api]
tokens = { demo = ["tenant-a", "tenant-b"], tenant-a-only = ["tenant-a"] }
