# The local judge (S5): Ministral 3 14B Instruct 2512, a family other than the generator's
# (NVIDIA's Nemotron), behind Ollama's OpenAI-compatible endpoint. A judge session runs one model,
# this one: it reads finished generation records and never generates, so generation and judging
# never share a session. Run it through the make targets only (docs/LOCAL-MODEL.md):
# `make judge-contract` runs the judge's live contract test in a session of its own.
#
# Pinned by tag AND digest (docs/plans/2026-10-20-s5-judged-metrics.md, D3: "Ministral 3 14B
# (Recommended)"). The orchestrator pulled it on 2026-10-20 at 17:00 in one guarded session
# (make ollama-up, ollama pull, make ollama-down, postcheck passed), as the user answered ("You
# run it (Recommended)"). The server's /api/tags then reported: digest 4760c35aeb9d...bcdcf7 (the
# tags page's prefix 4760c35aeb9d matches), 9082537546 bytes, format gguf, quantization Q4_K_M,
# family mistral3, 13.9B parameters, runner ggml, context length 262144. The same digest is the
# registry-manifest layer of the model's local manifest, which the session's preflight reads before
# the server starts (raglab.runtime.ollama): another digest there refuses the session.
# Read by raglab.evals.config.load_judge (strict: an unknown or missing key stops the run).
name = "judge-local"
suite = "judged"

[judge]
provider = "openai-compat"
model = "ministral-3:14b-instruct-2512-q4_K_M"
digest = "4760c35aeb9d9e9c6174c2492562c0b999e80a222804fd96b1915ab72bbcdcf7"
base_url = "http://127.0.0.1:11434"
# Sampling: temperature 0 and a fixed seed ([judging] seed), so a verdict is as repeatable as the
# runner makes it; the repeatability check measures it rather than assuming it. The model card
# advises "a temperature below 0.1" for production
# (https://huggingface.co/mistralai/Ministral-3-14B-Instruct-2512, read 2026-10-20 by the planner).
# An instruct model with no thinking to switch off: the live contract test checks that a reply
# carries no reasoning text.
temperature = 0
# One verdict is a small JSON object (a verdict, a quote, passage ids and one sentence); a reply
# cut at the cap is off the schema and recorded as invalid_output, never repaired.
max_tokens = 512
# The first request of a session loads the 9.1 GB model; the cap covers that load.
timeout_s = 180
# json_schema when the judge's runner accepts it (a GGUF build: the MLX runner's 501 does not
# apply); the live contract test probes both formats and records which this runner accepts.
response_format = "json_schema"

[judging]
seed = 20261020
level = 0.95
# The judged run's wall-clock cap (S6, docs/plans/2026-10-23-s6-judge-calibration.md, "The cap"),
# for the judged baseline on golden set v2 (S4b's run 1,
# 20261024T090351Z-generation-local-ollama-dev-ade9397). The dry run of 2026-10-24 with a scripted
# fake judge (no model) makes 1,400 judge calls: 19 canaries, 1,015 verdicts and 366 checks on the
# judge. The two measured means per call: 3,380.41 s / 592 = 5.710 s (S5's judged baseline,
# 5aa0ec5) and 3,257.091 s / 605 = 5.384 s (answer-v2's judged record, c14acb0). The rule: the
# count x the slower mean x 1.5, up to the next half hour: 1,400 x 5.710 s x 1.5 = 11,991 s, so
# 12,600 s (3 h 30 min). A run that hits it is partial and never published. The cap before it was
# S5's, 7,200 s (592 calls x the slowest canary call, 9.196 s, about 1.3 times, rounded up to two
# hours), under which the v1.1 judged records were made; the one-judge test holds them to this
# judge with the cap excepted.
run_timeout_s = 12600
criteria = "docs/CRITERIA.md"
canaries = "datasets/canaries.judge.jsonl"

# The server's session limits, the generator's (config/local-ollama.toml): loopback only, one
# model, one request at a time, a context of 8,192 tokens, the model unloaded soon after its last
# request, and 4 GiB of free memory on top of the model's size before a session may start.
[ollama]
host = "127.0.0.1:11434"
keep_alive = "2m"
max_loaded_models = 1
num_parallel = 1
context_length = 8192
memory_margin_gb = 4
