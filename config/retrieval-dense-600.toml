# Dense retrieval at chunk size 600 (the S1b halved-size experiment), measured end to end.
# Read by raglab.evals.config (strict: an unknown or missing key stops the run).
name = "retrieval-dense-600"
suite = "retrieval"

[dataset]
path = "datasets/golden.v2.jsonl"
split = "dev"

[chunker]
chunk_size = 600
overlap = 1

[embedder]
provider = "fastembed"
model = "BAAI/bge-small-en-v1.5"
revision = "aa8f8b060edb00e03bfdd08813a2949946c8ba55"

[retriever]
kind = "dense"
k = 5

[bootstrap]
seed = 20261006
resamples = 2000
level = 0.95
