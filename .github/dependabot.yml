# Monthly, with a 7-day cooldown. Minor and patch updates come as one grouped PR per ecosystem; a major update comes as
# its own PR so a breaking change does not block the safe ones. Commit messages and PR titles are
# Conventional Commits ("chore(deps): ..."), so they pass the conventions check; Dependabot's
# branches and missing CHANGELOG lines are exempt because the author is a bot.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # wait a week after a release before proposing it (compromised releases are usually pulled by then)
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # S5: the DeepEval tool project (tools/deepeval-check), with its own lock. A DeepEval bump comes as
  # a PR of its own, kept out of the group, so its checks are re-run before it merges
  # (make deepeval-test, then make deepeval-check in a judge session).
  - package-ecosystem: uv
    directory: /tools/deepeval-check
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["deepeval"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: monthly
    # wait a week after a release before proposing it (compromised releases are usually pulled by then)
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # wait a week after a release before proposing it (compromised releases are usually pulled by then)
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
