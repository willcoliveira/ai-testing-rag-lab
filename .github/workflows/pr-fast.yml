# pr-fast: every gate that needs no model and no key. Runs on every PR (forks included) and on main.
# Same targets as `make check`. Keyed gates (eval-on-change, nightly, weekly, release) come later
# and live in their own workflows behind an Environment with required reviewers.
name: pr-fast

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install uv (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r .github/ci-requirements.txt
      - name: Install the project
        run: uv sync --locked
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
      - name: Format
        run: make format
      - name: Lint
        run: make lint
      - name: Types
        run: make types
      - name: Dependencies and dead code
        run: make deps
      - name: Vulnerable dependencies
        run: make audit
      - name: SAST
        run: make sast
      - name: Workflow security
        run: make workflows
      - name: Secrets
        run: make secrets
      - name: Privacy (example list only in CI)
        run: make privacy
      # every message and added line of the PR's commits, so a string committed without the hooks
      # and removed in a later commit is caught; SHAs reach the shell through env only
      - name: Privacy of the PR's commits (example list only in CI)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make privacy-history RANGE="$BASE_SHA..$HEAD_SHA"
      - name: Architecture rules
        run: make architecture
      - name: Tests (offline)
        run: make test

  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # PR title and branch name are untrusted input: passed through env, never inlined in the script
      - name: PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_conventions.py --title "$PR_TITLE"
      - name: Branch name is semantic
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$PR_AUTHOR" in *"[bot]") echo "bot branch, exempt"; exit 0;; esac
          python scripts/check_conventions.py --branch "$HEAD_REF"
      - name: CHANGELOG has a line for this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/check_changelog.py --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR"
