# pr-fast: every gate that needs no hosted model and no key (the local embedding model is cached).
# Runs on every PR (forks included) and on main.
# Same targets as `make check`. Keyed gates (eval-on-change, nightly, weekly, release) come later
# and live in their own workflows behind an Environment with required reviewers.
name: pr-fast

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # the Ubuntu 24.04 (ubuntu-latest) packages; OCR text depends on the build, so it is pinned and
  # an image change fails the install instead of silently changing the OCR (S1b)
  TESSERACT_VERSION: "5.3.4-1build5"
  TESSDATA_VERSION: "1:4.1.0-2"
  # the embedding model's pinned revision (raglab.adapters.fastembed_embed.REVISION; a test keeps
  # them equal): the cache key, so a new revision never restores old files. The files live in
  # ~/.cache/raglab/models (the adapter's default), outside the checkout the scans read.
  EMBED_MODEL_REVISION: "aa8f8b060edb00e03bfdd08813a2949946c8ba55"

jobs:
  # the runner is pinned with the Tesseract packages: both move together, in one reviewed PR
  # (S1b decision), so a new ubuntu-latest never breaks the apt pins on every PR
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install uv (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r .github/ci-requirements.txt
      - name: Install the project
        run: uv sync --locked
      # S4: the golden file against its ten rules (answer key, register, inventory snapshot; no
      # model), first, so a broken dataset stops the job before any test or run
      - name: Dataset check (hard stop)
        run: make check-dataset
      # restored by revision; on a miss `make model` downloads it (network on, before the tests)
      # and on a hit it only checks every file's sha256, so a poisoned cache entry fails here
      - name: Restore the embedding model (cached by revision)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/raglab/models
          key: raglab-model-${{ env.EMBED_MODEL_REVISION }}
      - name: Embedding model (download on a miss, hashes checked)
        run: make model
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
      - name: Install Tesseract (pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            "tesseract-ocr=${TESSERACT_VERSION}" \
            "tesseract-ocr-eng=${TESSDATA_VERSION}" \
            "tesseract-ocr-osd=${TESSDATA_VERSION}"
          tesseract --version
      - name: Format
        run: make format
      - name: Lint
        run: make lint
      - name: Types
        run: make types
      - name: Dependencies and dead code
        run: make deps
      - name: Vulnerable dependencies
        run: make audit
      - name: SAST
        run: make sast
      - name: Workflow security
        run: make workflows
      - name: Secrets
        run: make secrets
      - name: Privacy (example list only in CI)
        run: make privacy
      # every message and added line of the PR's commits, so a string committed without the hooks
      # and removed in a later commit is caught; SHAs reach the shell through env only
      - name: Privacy of the PR's commits (example list only in CI)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make privacy-history RANGE="$BASE_SHA..$HEAD_SHA"
      - name: Architecture rules
        run: make architecture
      # the tests load the model from the cache only; HF_HUB_OFFLINE stops any library download
      - name: Tests (offline)
        env:
          HF_HUB_OFFLINE: "1"
        run: make test
      # S2: recall@5 of the default configuration on the dev split against the published baseline
      # (docs/THRESHOLDS.md); offline, the model from the cache
      - name: Retrieval no-regression gate (offline)
        env:
          HF_HUB_OFFLINE: "1"
        run: make gate
      # S3: `raglab serve` with config/fake.toml on 127.0.0.1, then /healthz, /version, an /ask
      # answer and a no-tenant refusal; offline (the fake model, the cached embedder, loopback only)
      - name: API smoke (offline, fake model)
        env:
          HF_HUB_OFFLINE: "1"
        run: make api-smoke

  # S9 (D3: "Own parallel job; median gated at 2× the slowest of ten runs"): the k6 smoke against
  # the perf stub, beside `check`, so pr-fast's wall time stays the check job's. `make perf-smoke`
  # fetches k6 2.3.0 and the collector from their release archives and checks each sha256 against
  # its pin in scripts/perf_smoke.py (no third-party action), serves config/perf.toml with
  # PERF_TEST_MODE=1 and RAGLAB_ENV=ci on loopback, and writes /ask's median and p95 to the step
  # summary. The server reads the scanned page when it starts, so Tesseract is installed as in
  # `check`; the embedder comes from the same cache.
  perf:
    name: perf
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r .github/ci-requirements.txt
      - name: Install the project
        run: uv sync --locked
      - name: Restore the embedding model (cached by revision)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/raglab/models
          key: raglab-model-${{ env.EMBED_MODEL_REVISION }}
      - name: Embedding model (download on a miss, hashes checked)
        run: make model
      - name: Install Tesseract (pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            "tesseract-ocr=${TESSERACT_VERSION}" \
            "tesseract-ocr-eng=${TESSDATA_VERSION}" \
            "tesseract-ocr-osd=${TESSDATA_VERSION}"
          tesseract --version
      - name: k6 smoke against the perf stub (offline, loopback only)
        env:
          HF_HUB_OFFLINE: "1"
        run: make perf-smoke

  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # PR title and branch name are untrusted input: passed through env, never inlined in the script
      - name: PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_conventions.py --title "$PR_TITLE"
      - name: Branch name is semantic
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$PR_AUTHOR" in *"[bot]") echo "bot branch, exempt"; exit 0;; esac
          python scripts/check_conventions.py --branch "$HEAD_REF"
      - name: CHANGELOG has a line for this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/check_changelog.py --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR"
