[project]
name = "raglab"
version = "0.1.0"
description = "A small RAG assistant over a fictional security policy pack, built and tested stage by stage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Oliveira" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.144.0",
    "fastembed==0.9.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pypdf==6.19.0",
    "pytesseract==0.3.13",
    "pyyaml==6.0.3",
    "rank-bm25==0.2.2",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[project.scripts]
raglab = "raglab.__main__:main"

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "deptry==0.25.1",
    "fpdf2==2.8.9",
    "pillow==12.3.0",
    "pip-audit==2.10.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
    "vulture==2.16",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

# S9: googleapis-common-protos comes in through the OTLP exporter. 1.76.0 was uploaded on
# 2026-10-22, inside the 7-day cooldown, so a lock taken before 2026-10-29 keeps 1.75.5 (uploaded
# 2026-09-29); drop this line after that date. tools/deepeval-check/pyproject.toml has the same.
[tool.uv]
constraint-dependencies = ["googleapis-common-protos==1.75.5"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; subprocess runs our own scripts and git in temp dirs
"tests/**" = ["S101", "S603", "S607"]
"tools/*/tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.13"
strict = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast, no network, no model",
    "contract: shared adapter contract tests (live adapters run them only with keys)",
    "ingestion: parsing and chunking, no model",
    "retrieval: retrieval metrics with a local or fake embedder",
    "e2e_fake: end to end through the API with the fake model",
    "security: deterministic attack and guard suites",
    "ocr: needs tesseract",
    "live: calls a real model; needs a key or a local server",
    "judged: uses an LLM judge; needs a key or a local server",
    "guardrails: Guardrails AI validators with cached local models",
    "perf: load and latency",
]

[tool.deptry]
known_first_party = ["raglab"]
# S5: tools/deepeval-check is a project of its own, with its own dependencies and lock
extend_exclude = ["tools"]

[tool.deptry.per_rule_ignores]
# the modules of fpdf2 and pillow: build-time only, for scripts/build_corpus.py, which renders
# the corpus PDF, HTML export and scanned page; nothing under src/ imports them
DEP004 = ["fpdf", "PIL"]

[tool.vulture]
paths = ["src", "scripts"]
min_confidence = 80
